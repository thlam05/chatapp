# fleet.conf — app manifest. Sourced (as shell) by the lifecycle scripts
# (./run ./start ./restart ./reload ./stop). Language-agnostic: fill in the
# commands for YOUR stack. `$PORT` is available inside every
# command. Leave a command empty ("") to skip that step.

NAME='chatapp'        # shown in logs
PORT="3000"                # default port; the fleet overrides via injected $PORT
HEALTH_PATH="/"            # path that returns 200 once the app is ready

# --- process runtime: the QA tester's self-host, and local work without docker ---
# Left empty on purpose: the app is a Spring Boot + MySQL + nginx stack that only runs
# through compose.yaml (the docker runtime below).
# SINGLE-QUOTE any command that uses $PORT, so it expands when
# the command RUNS (with the fleet-injected values), not when this file is read.
INSTALL_CMD=''             # fetch dependencies / toolchain
BUILD_CMD=''               # produce a PRODUCTION build (empty if none)
START_CMD=''               # start the server in the FOREGROUND, listening on $PORT
RELOAD_CMD=''              # optional: apply new config without a rebuild
                           # (empty => ./reload falls back to a no-build stop+start)

# --- docker runtime (compose.yaml) ---------------------------------------------
# How the fleet runs the app: as containers, in the coordinator's private docker. These
# REPLACE the commands above, which stay for the QA tester's self-host and for local work
# without docker (`FLEET_RUNTIME=process bin/run`). START runs compose in the FOREGROUND
# so the fleet's stop can end it. See bin/_common.sh.
DOCKER_BUILD_CMD='docker compose build'
DOCKER_START_CMD='docker compose up --remove-orphans'
DOCKER_RELOAD_CMD=''
