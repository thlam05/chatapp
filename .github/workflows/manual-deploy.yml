# The workflow Fleet Control dispatches. Its NAME is the contract: the dashboard's
# Run CI button, the CI panel on the workspace card and the board's CI peek all call
# `gh workflow run manual-deploy.yml` (FLEET_CI_WORKFLOW, backend/shared/provision.py).
# Rename the file and those buttons 404 with "no manual-deploy.yml on this ref".
#
# Deliberately a thin wrapper around the reusable deploy.yml rather than the build
# itself: an `on: push` trigger can be added to a sibling workflow that calls the same
# reusable job, so automatic and manual builds can never drift into two recipes.
#
# No `environment:` here — GitHub does not accept that key on a job that `uses:` a reusable
# workflow (the file fails to parse and every dispatch 422s). The per-environment build job
# INSIDE deploy.yml names its Environment (`environment: ${{ matrix.env }}`), which is where
# the fleet's per-environment CI variables (Workspace settings ▸ CI vars) are scoped.
name: CI (manual)

#
# No inputs, on purpose: every dispatch builds EVERY fleet environment. A release names one
# run and needs beta's AND production's image from it, so a run scoped to one environment
# (2026-10-08: an agent dispatched `-f environments='["beta"]'`) could never be released.
# With no inputs declared, GitHub refuses such a dispatch outright.
on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environments: '["beta","production"]'
    permissions:
      # OIDC: the token GitHub mints here is what Google exchanges for the deploy
      # service account. Without `id-token: write` the auth step fails before it
      # reaches GCP at all.
      id-token: write
      contents: read
